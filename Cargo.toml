[package]
name = "p-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "p-rust"
path = "src/main.rs"
[[bin]]
name = "p-rust-ui"
path = "src/bin/ui.rs"

[dependencies]
slint = "1.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
arboard = "3.4"
clipboard-master = "4.0"
rdev = "0.5"
dirs = "6.0.0"

[build-dependencies]
slint-build = "1.5"

[package.metadata.bundle]
name = "P-Rust"
identifier = "com.prust.app"
icon = ["assets/icon.icns"]
version = "0.1.0"
copyright = "Copyright (c) 2026"
short_description = "Un gestionnaire de presse-papier rapide et invisible"